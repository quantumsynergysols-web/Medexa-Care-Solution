# /etc/nginx/sites-available/medexacaresolutions.com
# Certbot (`certbot --nginx`) adds the HTTPS listeners and certificate lines to this file.

upstream medexa_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# www -> apex. The redirect lives inside `location /` so Certbot's ACME challenge still works.
server {
    listen 80;
    listen [::]:80;
    server_name www.medexacaresolutions.com;

    location / {
        return 301 https://medexacaresolutions.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name medexacaresolutions.com;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        proxy_pass http://medexa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors cannot spoof their IP and dodge the form rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
